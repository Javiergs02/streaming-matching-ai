# ==============================================================================
# NGINX REVERSE PROXY SNIPPET FOR STREAMLIT BI DASHBOARD
# ==============================================================================
# Add this 'location /bi/' block inside your Nginx 'server' configuration.
# Provides full WebSocket support and timeout buffering for data dashboards.
# ==============================================================================

location /bi/ {
    proxy_pass http://bi_dashboard:8501/;
    proxy_http_version 1.1;

    # Essential WebSocket support for Streamlit
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Standard reverse proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Prevent connection drops during heavy aggregation queries
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}
